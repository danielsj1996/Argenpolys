<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#F8FAFC"/>
  <!-- Rieles -->
  <line x1="0" y1="56" x2="64" y2="56" stroke="#475569" stroke-width="4"/>
  <line x1="10" y1="53" x2="10" y2="59" stroke="#334155" stroke-width="2"/>
  <line x1="24" y1="53" x2="24" y2="59" stroke="#334155" stroke-width="2"/>
  <line x1="38" y1="53" x2="38" y2="59" stroke="#334155" stroke-width="2"/>
  <line x1="52" y1="53" x2="52" y2="59" stroke="#334155" stroke-width="2"/>
  <!-- Caldera y cuerpo de la locomotora -->
  <rect x="18" y="26" width="34" height="20" rx="3" fill="#0F172A"/>
  <!-- Cabina del maquinista -->
  <rect x="38" y="16" width="18" height="30" fill="#1E293B" rx="2"/>
  <rect x="42" y="20" width="10" height="8" fill="#E2E8F0" rx="1"/>
  <!-- Chimenea y humo -->
  <rect x="22" y="18" width="6" height="10" fill="#0F172A"/>
  <polygon points="20,18 30,18 28,14 22,14" fill="#0F172A"/>
  <circle cx="25" cy="10" r="3" fill="#94A3B8" opacity="0.7"/>
  <circle cx="21" cy="6" r="4" fill="#CBD5E1" opacity="0.6"/>
  <!-- Faro delantero -->
  <polygon points="12,30 18,33 18,39 12,42" fill="#F59E0B"/>
  <!-- Ruedas motrices -->
  <circle cx="22" cy="50" r="6" fill="#334155"/>
  <circle cx="22" cy="50" r="2" fill="#E2E8F0"/>
  <circle cx="36" cy="50" r="6" fill="#334155"/>
  <circle cx="36" cy="50" r="2" fill="#E2E8F0"/>
  <circle cx="50" cy="50" r="6" fill="#334155"/>
  <circle cx="50" cy="50" r="2" fill="#E2E8F0"/>
  <line x1="22" y1="50" x2="50" y2="50" stroke="#DC2626" stroke-width="2"/>
</svg>