  <!-- Esfera del reloj -->
  <circle cx="32" cy="30" r="4" fill="#F4F6F7"/>
  <line x1="32" y1="30" x2="32" y2="28" stroke="#17202A" stroke-width="1"/>
  <line x1="32" y1="30" x2="34" y2="30" stroke="#17202A" stroke-width="1"/>
  <!-- Base de troncos y piedra -->
  <rect x="0" y="52" width="64" height="12" fill="#566573"/>
  <rect x="28" y="44" width="8" height="12" fill="#17202A"/>
